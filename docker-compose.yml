name: mp-traefik

services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      # Habilita o dashboard web
      - --api.dashboard=true

      # Provider Docker: monitora containers automaticamente
      - --providers.docker=true
      # Seguranca: containers so sao expostos se tiverem traefik.enable=true
      - --providers.docker.exposedbydefault=false
      # Rede compartilhada entre todas as stacks
      - --providers.docker.network=traefik-public

      # Entrypoints: portas de entrada
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Redireciona todo HTTP para HTTPS automaticamente
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # Let's Encrypt: emissao e renovacao automatica de certificados SSL
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=angelo.mcbraga@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

      # Provider de arquivos: rotas para servicos que NAO sao containers Docker
      # (ex.: Grafana na VM srv-grafana). Os arquivos ficam em /opt/mp-traefik/dynamic no servidor
      # e sao recarregados sozinhos, sem reiniciar o Traefik.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Logs de operacao
      - --log.level=INFO

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Permite ao Traefik monitorar containers Docker (somente leitura)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Volume persistente para armazenar os certificados SSL
      - letsencrypt:/letsencrypt
      # Rotas dinamicas (provider de arquivos), somente leitura. Criar o diretorio no servidor:
      #   sudo mkdir -p /opt/mp-traefik/dynamic
      - /opt/mp-traefik/dynamic:/etc/traefik/dynamic:ro

    networks:
      - traefik-public

    labels:
      - traefik.enable=true

      # Rota do dashboard: https://traefik.minaspneus.com.br
      - traefik.http.routers.dashboard.rule=Host(`traefik.minaspneus.com.br`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth

      # Autenticacao basica para proteger o dashboard
      # Para gerar o hash: htpasswd -nb admin suasenha
      # Atencao: troque cada $ por $$ ao colar aqui
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$HASH_AQUI"

networks:
  traefik-public:
    external: true  # Criada manualmente no servidor: docker network create traefik-public

volumes:
  letsencrypt:  # Gerenciado pelo Docker, sobrevive a docker compose down
